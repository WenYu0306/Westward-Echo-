[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
# UP045 (Optional[X] -> X | None): the runtime is 3.11 (see mypy below), so the
# syntax is fine; this rule is off because converting the existing Optional[X]
# annotations is a mechanical rewrite with no behavioural payoff.
ignore = ["UP045"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# These modules store non-code content as Python strings: single-page
# HTML/CSS/JS templates (markup) and LLM prompt templates. Their long lines
# are content, not code — wrapping them would break URLs/CSS/JS or change
# the prompt text, so line length is not enforced inside them.
"src/web_ui.py" = ["E501"]
"src/editor_ui.py" = ["E501"]
"src/dashboard.py" = ["E501"]
"src/usage_ui.py" = ["E501"]
"src/agent/prompts/read.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain.*",
    "langchain_openai.*",
    "langchain_core.*",
    "chromadb.*",
    "fastapi.*",
    "uvicorn.*",
    "celery.*",
    "redis.*",
    "httpx.*",
    "tenacity.*",
    "pydantic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Both markers mean "this test talks to a real provider", i.e. it costs money.
# Default runs exclude them, so `pytest` alone is always ¥0.
addopts = "-m 'not requires_api_key and not live_api'"
markers = [
    "requires_api_key: legacy live-API marker (needs a real provider key)",
    "live_api: test intentionally makes real, billable LLM calls; run only after the cost has been announced, via `pytest -m live_api`",
]

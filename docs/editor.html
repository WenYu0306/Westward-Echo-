<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>编辑 — 西渡 / Westward Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:400;font-size:14px;line-height:1.6;
  color:#1c1c1e;background:#f5f5f7;overflow:hidden;height:100vh;
}
::selection{background:rgba(0,102,204,.18)}

/* ═══════════════════════════════════════════════════════════════
   TOP BAR
   ═══════════════════════════════════════════════════════════════ */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  height:48px;padding:0 16px;background:#fff;
  border-bottom:1px solid #e5e5ea;flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-brand{
  font-family:"Noto Serif SC",serif;font-size:15px;font-weight:700;
  letter-spacing:1px;color:#1c1c1e;
}
.topbar-brand .en{
  font-family:Inter,sans-serif;font-weight:400;font-size:11px;
  color:#8e8e93;letter-spacing:0;margin-left:4px;
}
.topbar-divider{width:1px;height:20px;background:#e5e5ea}
.topbar-title{font-size:13px;font-weight:500;color:#3a3a3c}
.topbar-stats{font-size:12px;color:#8e8e93}
.topbar-stats strong{color:#1c1c1e;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-back{
  font-size:12px;color:#0071e3;text-decoration:none;font-weight:500;
  padding:6px 10px;border-radius:6px;transition:background .15s;
}
.topbar-back:hover{background:rgba(0,113,227,.06)}

.save-indicator{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
  padding:4px 10px;border-radius:6px;
}
.save-indicator.saved{color:#34c759;background:rgba(52,199,89,.06)}
.save-indicator.saving{color:#ff9500;background:rgba(255,149,0,.06)}
.save-indicator.idle{color:#8e8e93;background:transparent}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner-sm{
  display:inline-block;width:12px;height:12px;
  border:2px solid #d2d2d7;border-top-color:#ff9500;border-radius:50%;
  animation:spin .6s linear infinite;
}

.btn-epub{
  display:inline-flex;align-items:center;gap:4px;
  padding:7px 16px;font-family:Inter,sans-serif;font-size:12px;font-weight:600;
  color:#fff;background:#0071e3;border:none;border-radius:8px;
  cursor:pointer;transition:all .15s;text-decoration:none;letter-spacing:.1px;
}
.btn-epub:hover{background:#0077ed;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,113,227,.2)}
.btn-epub:active{transform:scale(.98)}

/* ═══════════════════════════════════════════════════════════════
   CHAPTER SELECTOR
   ═══════════════════════════════════════════════════════════════ */
.chapter-selector{
  display:flex;align-items:center;gap:6px;
  height:48px;padding:0 16px;background:#fff;
  border-bottom:1px solid #f0f0f5;overflow-x:auto;flex-shrink:0;
  white-space:nowrap;
}
.chapter-selector::-webkit-scrollbar{height:0}
.chapter-selector-label{
  font-size:11px;font-weight:600;color:#aeaeb2;text-transform:uppercase;
  letter-spacing:.5px;flex-shrink:0;margin-right:4px;
}
.ch-btn{
  flex-shrink:0;padding:6px 12px;font-size:12px;font-weight:500;color:#6e6e73;
  background:transparent;border:1px solid transparent;border-radius:6px;
  cursor:pointer;transition:all .15s;font-family:Inter,sans-serif;
}
.ch-btn:hover{background:#f5f5f7;color:#1c1c1e}
.ch-btn.active{background:#0071e3;color:#fff;border-color:#0071e3;font-weight:600}
.ch-btn.edited::after{
  content:" ";display:inline-block;width:5px;height:5px;background:#ff9500;
  border-radius:50%;margin-left:4px;position:relative;top:-4px;
}

/* ═══════════════════════════════════════════════════════════════
   MAIN EDITOR AREA
   ═══════════════════════════════════════════════════════════════ */
.editor-body{
  display:flex;flex:1;overflow:hidden;height:calc(100vh - 96px);
}

/* ── Columns ── */
.editor-col{
  overflow-y:auto;padding:16px 20px;
}
.editor-col::-webkit-scrollbar{width:5px}
.editor-col::-webkit-scrollbar-track{background:transparent}
.editor-col::-webkit-scrollbar-thumb{background:#e5e5ea;border-radius:3px}

.col-cn{
  flex:0 0 35%;background:#fafafa;
  border-right:1px solid #f0f0f5;
}
.col-en{
  flex:0 0 35%;background:#fff;
}
.col-tools{
  flex:0 0 30%;background:#fafafa;
  border-left:1px solid #f0f0f5;display:flex;flex-direction:column;
}

/* ── Column headers ── */
.col-header{
  font-size:10px;font-weight:600;color:#aeaeb2;text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid #f0f0f5;position:sticky;top:0;z-index:1;
}
.col-cn .col-header{background:#fafafa}
.col-en .col-header{background:#fff}

/* ═══════════════════════════════════════════════════════════════
   PARAGRAPHS
   ═══════════════════════════════════════════════════════════════ */
.para-wrap{display:flex;margin-bottom:8px;min-height:28px;position:relative}
.para-num{
  flex-shrink:0;width:28px;text-align:right;font-size:10px;color:#c7c7cc;
  padding-top:3px;padding-right:8px;user-select:none;
}

/* CN paragraph (read-only) */
.para-cn{
  font-family:"Noto Serif SC",serif;font-size:15px;line-height:1.9;
  color:#1c1c1e;padding:6px 10px;border-radius:6px;
  background:transparent;transition:background .2s;
  flex:1;min-width:0;word-break:break-word;
}

/* EN paragraph (editable) */
.para-en{
  font-family:Inter,"Georgia",serif;font-size:14px;line-height:1.8;
  color:#2c2c2e;padding:6px 10px;border-radius:6px;
  border:1.5px solid transparent;outline:none;
  transition:all .15s;background:#fff;
  flex:1;min-width:0;word-break:break-word;
  cursor:text;
}
.para-en:hover{border-color:#d2d2d7;background:#fafafa}
.para-en:focus,.para-en:focus-visible{
  border-color:#0071e3;background:#fff;
  box-shadow:0 0 0 3px rgba(0,113,227,.1);
}
.para-en.modified{
  border-left:3px solid #ff9500;padding-left:7px;background:#fffbf0;
}

/* Synced scroll highlight */
.para-cn.synced, .para-en.synced{
  background:rgba(0,113,227,.04);border-radius:6px;
}

/* ═══════════════════════════════════════════════════════════════
   TERM HIGHLIGHTS
   ═══════════════════════════════════════════════════════════════ */
.term-hl{
  background:rgba(0,113,227,.12);border-radius:3px;padding:0 1px;
  cursor:help;position:relative;border-bottom:1px dotted rgba(0,113,227,.3);
}
.term-hl:hover{background:rgba(0,113,227,.2)}
.term-tooltip{
  display:none;position:absolute;bottom:calc(100% + 6px);left:50%;
  transform:translateX(-50%);background:#1c1c1e;color:#fff;
  font-size:11px;font-family:Inter,sans-serif;padding:4px 10px;
  border-radius:6px;white-space:nowrap;z-index:99;pointer-events:none;
}
.term-hl:hover .term-tooltip{display:block}

/* ═══════════════════════════════════════════════════════════════
   TOOLS PANEL
   ═══════════════════════════════════════════════════════════════ */
.tools-section{
  padding:16px 0;border-bottom:1px solid #e5e5ea;
}
.tools-section:first-child{padding-top:0}
.tools-section-title{
  font-size:10px;font-weight:600;color:#8e8e93;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:10px;
}
.tools-section p{
  font-size:12px;color:#6e6e73;line-height:1.6;margin-bottom:8px;
}

/* Batch replace form */
.field-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.field-row input{
  flex:1;padding:7px 10px;font-size:12px;font-family:Inter,sans-serif;
  border:1px solid #d2d2d7;border-radius:6px;outline:none;
  transition:border-color .15s;
}
.field-row input:focus{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.1)}
.field-row label{font-size:11px;color:#8e8e93;flex-shrink:0}

.btn-tool{
  padding:8px 16px;font-family:Inter,sans-serif;font-size:12px;font-weight:600;
  color:#fff;background:#0071e3;border:none;border-radius:8px;
  cursor:pointer;transition:all .15s;width:100%;
}
.btn-tool:hover{background:#0077ed;transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,113,227,.2)}
.btn-tool:active{transform:scale(.98)}
.btn-tool:disabled{background:#aeaeb2;cursor:not-allowed;transform:none;box-shadow:none}

.btn-tool-secondary{
  padding:8px 16px;font-family:Inter,sans-serif;font-size:12px;font-weight:500;
  color:#0071e3;background:rgba(0,113,227,.06);border:1px solid rgba(0,113,227,.15);
  border-radius:8px;cursor:pointer;transition:all .15s;width:100%;margin-top:4px;
}
.btn-tool-secondary:hover{background:rgba(0,113,227,.12)}
.btn-tool-secondary:active{transform:scale(.98)}

.batch-result{
  font-size:11px;color:#34c759;margin-top:6px;display:none;
}
.batch-result.error{color:#ff3b30}

/* Glossary highlight list */
.glossary-list{
  max-height:200px;overflow-y:auto;font-size:11px;
}
.glossary-list::-webkit-scrollbar{width:4px}
.glossary-list::-webkit-scrollbar-track{background:transparent}
.glossary-list::-webkit-scrollbar-thumb{background:#e5e5ea;border-radius:2px}

.glossary-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 0;border-bottom:1px solid #f5f5f7;
}
.glossary-cn{font-weight:500;color:#1c1c1e}
.glossary-en{color:#0071e3;font-size:11px}

/* Shortcuts reference */
.shortcut-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:3px 0;font-size:11px;
}
.shortcut-key{
  display:inline-block;padding:1px 6px;font-size:10px;font-family:"SF Mono","Fira Code",monospace;
  background:#e5e5ea;border-radius:3px;color:#3a3a3c;font-weight:500;
}
.shortcut-desc{color:#8e8e93}

/* ═══════════════════════════════════════════════════════════════
   BOTTOM BAR
   ═══════════════════════════════════════════════════════════════ */
.bottombar{
  display:flex;align-items:center;justify-content:space-between;
  height:44px;padding:0 16px;background:#fff;
  border-top:1px solid #e5e5ea;flex-shrink:0;
}
.bottombar-left{display:flex;align-items:center;gap:12px;font-size:11px;color:#8e8e93}
.bottombar-left .shortcut{display:flex;align-items:center;gap:4px}
.btn-save{
  padding:8px 28px;font-family:Inter,sans-serif;font-size:13px;font-weight:600;
  color:#fff;background:#0071e3;border:none;border-radius:8px;
  cursor:pointer;transition:all .15s;letter-spacing:.1px;
}
.btn-save:hover{background:#0077ed;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,113,227,.25)}
.btn-save:active{transform:scale(.98)}
.btn-save:disabled{background:#aeaeb2;cursor:not-allowed;transform:none;box-shadow:none}

/* ═══════════════════════════════════════════════════════════════
   LOADING / EMPTY / ERROR
   ═══════════════════════════════════════════════════════════════ */
.loading-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:#8e8e93;
}
.loading-state .spinner-lg{
  width:28px;height:28px;border:3px solid #e5e5ea;
  border-top-color:#0071e3;border-radius:50%;
  animation:spin .6s linear infinite;margin-bottom:12px;
}
.loading-state .text{font-size:13px}
.error-state{color:#ff3b30;text-align:center;padding:40px}
.error-state .icon{font-size:36px;margin-bottom:8px}
.error-state .msg{font-size:13px}

/* ═══════════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════════ */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  padding:10px 22px;border-radius:10px;font-size:13px;font-weight:500;
  color:#fff;background:#1c1c1e;box-shadow:0 8px 24px rgba(0,0,0,.15);
  z-index:999;opacity:0;pointer-events:none;transition:opacity .3s;
}
.toast.show{opacity:1}
.toast.error{background:#ff3b30}

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════════ */
@media(max-width:900px){
  .editor-body{flex-direction:column;overflow-y:auto}
  .col-cn,.col-en,.col-tools{flex:1 1 auto;width:100%;border-right:none;border-left:none}
  .col-tools{border-top:1px solid #e5e5ea}
  .col-cn .col-header,.col-en .col-header{position:static}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ═════════════ TOP BAR ═════════════ -->
<header class="topbar">
  <div class="topbar-left">
    <div class="topbar-brand">西渡<span class="en">Westward Echo</span></div>
    <div class="topbar-divider"></div>
    <div class="topbar-title" id="topbar-title">编辑器</div>
    <div class="topbar-divider"></div>
    <div class="topbar-stats" id="topbar-stats">
      章节 <strong id="stats-edited">0</strong> / <strong id="stats-total">0</strong> 已编辑
    </div>
  </div>
  <div class="topbar-right">
    <div class="save-indicator idle" id="save-indicator">
      <span id="save-icon"></span>
      <span id="save-text">未修改</span>
    </div>
    <a class="btn-epub" id="btn-epub" href="#" target="_blank">导出 EPUB</a>
    <a class="topbar-back" href="/">&larr; 返回</a>
  </div>
</header>

<!-- ═════════════ CHAPTER SELECTOR ═════════════ -->
<nav class="chapter-selector" id="chapter-selector">
  <span class="chapter-selector-label">章节</span>
  <div id="chapter-buttons" style="display:flex;gap:4px"></div>
</nav>

<!-- ═════════════ EDITOR BODY ═════════════ -->
<div class="editor-body" id="editor-body">

  <!-- Left: CN original -->
  <div class="editor-col col-cn" id="col-cn">
    <div class="col-header">中文原文</div>
    <div id="cn-content"></div>
  </div>

  <!-- Right: EN translation -->
  <div class="editor-col col-en" id="col-en">
    <div class="col-header">英文翻译</div>
    <div id="en-content"></div>
  </div>

  <!-- Side panel: Tools -->
  <div class="editor-col col-tools" id="col-tools">
    <div class="col-header">编辑工具</div>

    <div class="tools-section">
      <div class="tools-section-title">批量术语替换</div>
      <p>将英文翻译中的某个词或短语全部替换</p>
      <div class="field-row">
        <label>查找:</label>
        <input type="text" id="batch-old" placeholder="输入要查找的英文...">
      </div>
      <div class="field-row">
        <label>替换:</label>
        <input type="text" id="batch-new" placeholder="替换为...">
      </div>
      <button class="btn-tool" id="btn-batch-replace" disabled>替换术语</button>
      <div class="batch-result" id="batch-result"></div>
    </div>

    <div class="tools-section">
      <div class="tools-section-title">当前术语</div>
      <div class="glossary-list" id="glossary-list">
        <span style="color:#aeaeb2;font-size:11px">加载中...</span>
      </div>
    </div>

    <div class="tools-section">
      <div class="tools-section-title">快捷键</div>
      <div class="shortcut-row"><span class="shortcut-desc">保存</span><span class="shortcut-key">Ctrl+S</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">下一段</span><span class="shortcut-key">Tab</span></div>
      <div class="shortcut-row"><span class="shortcut-desc">上一段</span><span class="shortcut-key">Shift+Tab</span></div>
    </div>
  </div>
</div>

<!-- ═════════════ BOTTOM BAR ═════════════ -->
<footer class="bottombar">
  <div class="bottombar-left">
    <div class="shortcut"><span class="shortcut-key">Ctrl+S</span> 保存</div>
    <div class="shortcut"><span class="shortcut-key">Tab</span> 下一段</div>
    <div class="shortcut"><span class="shortcut-key">Shift+Tab</span> 上一段</div>
  </div>
  <button class="btn-save" id="btn-save">保存</button>
</footer>

<script>
// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const JOB_ID = document.currentScript ? null : null;
// Injected at serve time via string replace
const jobId = "demo";

let currentChapter = 1;
let totalChapters = 0;
let chapters = [];  // [{chapter_num, title}]
let cnParagraphs = [];
let enParagraphs = [];
let editedSet = new Set();  // chapter numbers that have edits
let modifiedParagraphs = {};  // {index: text} for current chapter
let glossary = {};  // {cn: en}
let saveTimer = null;
let autoSaveTimer = null;
let isDirty = false;
let isLoading = false;

// ── DOM refs ──
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const topbarTitle = $('#topbar-title');
const statsEdited = $('#stats-edited');
const statsTotal = $('#stats-total');
const saveIndicator = $('#save-indicator');
const saveIcon = $('#save-icon');
const saveText = $('#save-text');
const chapterSelector = $('#chapter-selector');
const chapterButtons = $('#chapter-buttons');
const cnContent = $('#cn-content');
const enContent = $('#en-content');
const batchOld = $('#batch-old');
const batchNew = $('#batch-new');
const btnBatchReplace = $('#btn-batch-replace');
const batchResult = $('#batch-result');
const glossaryList = $('#glossary-list');
const btnSave = $('#btn-save');
const btnEpub = $('#btn-epub');
const toast = $('#toast');
const colCn = $('#col-cn');
const colEn = $('#col-en');

// ═══════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════

function showToast(msg, isError) {
  toast.textContent = msg;
  toast.className = 'toast' + (isError ? ' error' : '');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function setSaveStatus(status) {
  saveIndicator.className = 'save-indicator ' + status;
  if (status === 'saved') {
    saveIcon.innerHTML = '&#10003;';
    saveText.textContent = '已保存';
  } else if (status === 'saving') {
    saveIcon.innerHTML = '<span class="spinner-sm"></span>';
    saveText.textContent = '保存中...';
  } else {
    saveIcon.innerHTML = '';
    saveText.textContent = '未修改';
  }
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════

async function init() {
  btnEpub.href = '/api/epub/' + jobId;

  // Load glossary
  try {
    const r = await fetch('/api/glossary/' + jobId);
    const d = await r.json();
    if (!d.error) glossary = d;
  } catch (e) { /* fine */ }

  renderGlossary();

  // Load chapter list
  await loadChapterList();

  // Load first chapter
  await loadChapter(1);

  // Load stats
  loadStats();
}

async function loadStats() {
  try {
    const r = await fetch('/api/editor/' + jobId + '/stats');
    const d = await r.json();
    statsEdited.textContent = d.edited_chapters;
    statsTotal.textContent = d.total_chapters;
  } catch (e) { /* ignore */ }
}

async function loadChapterList() {
  try {
    const r = await fetch('/api/editor/' + jobId + '/chapters');
    chapters = await r.json();
    if (chapters.error) { showToast(chapters.error, true); return; }
    totalChapters = chapters.length;
    statsTotal.textContent = totalChapters;
    renderChapterButtons();
  } catch (e) {
    showToast('无法加载章节列表', true);
  }
}

function renderChapterButtons() {
  let h = '';
  chapters.forEach(ch => {
    const num = ch.chapter_num;
    const active = num === currentChapter ? ' active' : '';
    const edited = editedSet.has(num) ? ' edited' : '';
    h += '<button class="ch-btn' + active + edited + '" data-ch="' + num + '">' + num + '</button>';
  });
  chapterButtons.innerHTML = h;

  chapterButtons.querySelectorAll('.ch-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = parseInt(btn.dataset.ch);
      if (num !== currentChapter) switchChapter(num);
    });
  });

  // Scroll active button into view
  const activeBtn = chapterButtons.querySelector('.ch-btn.active');
  if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

async function switchChapter(num) {
  if (isDirty) await saveCurrentChapter();

  currentChapter = num;
  renderChapterButtons();
  await loadChapter(num);
}

async function loadChapter(num) {
  if (isLoading) return;
  isLoading = true;

  cnContent.innerHTML = '<div class="loading-state"><div class="spinner-lg"></div><div class="text">加载中...</div></div>';
  enContent.innerHTML = '<div class="loading-state"><div class="spinner-lg"></div><div class="text">加载中...</div></div>';
  modifiedParagraphs = {};
  isDirty = false;
  setSaveStatus('idle');
  btnSave.disabled = true;

  try {
    const r = await fetch('/api/editor/' + jobId + '/chapters/' + num);
    const d = await r.json();

    if (d.error) {
      cnContent.innerHTML = '<div class="error-state"><div class="icon">&#9888;</div><div class="msg">' + esc(d.error) + '</div></div>';
      enContent.innerHTML = '';
      isLoading = false;
      return;
    }

    cnParagraphs = d.cn_paragraphs || [];
    enParagraphs = d.en_paragraphs || [];

    topbarTitle.textContent = d.title || ('Chapter ' + num);

    // Check for existing edits and mark paragraphs as modified
    if (d.edits) {
      Object.keys(d.edits).forEach(k => {
        modifiedParagraphs[parseInt(k)] = d.edits[k];
      });
      if (Object.keys(d.edits).length > 0) {
        isDirty = true;
        setSaveStatus('saved'); // These are already saved on server
        btnSave.disabled = true;
        editedSet.add(num);
      }
    }

    renderParagraphs();
    isLoading = false;
  } catch (e) {
    cnContent.innerHTML = '<div class="error-state"><div class="icon">&#9888;</div><div class="msg">加载失败：' + esc(e.message) + '</div></div>';
    enContent.innerHTML = '';
    isLoading = false;
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDER PARAGRAPHS
// ═══════════════════════════════════════════════════════════════

function highlightTerms(text, lang) {
  // Highlight glossary terms in text
  if (!glossary || !Object.keys(glossary).length) return esc(text);

  let result = esc(text);

  if (lang === 'cn') {
    // Highlight CN terms
    const cnTerms = Object.keys(glossary).sort((a, b) => b.length - a.length);
    cnTerms.forEach(cn => {
      const en = glossary[cn];
      const escapedCn = esc(cn);
      const escapedEn = esc(en);
      const regex = new RegExp(escapedCn.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'g');
      result = result.replace(regex,
        '<span class="term-hl">$&<span class="term-tooltip">' + escapedEn + '</span></span>');
    });
  } else {
    // Highlight EN terms
    const enTerms = Object.entries(glossary).sort((a, b) => b[1].length - a[1].length);
    enTerms.forEach(([cn, en]) => {
      const escapedEn = esc(en);
      const escapedCn = esc(cn);
      // Match whole word / phrase
      const regex = new RegExp(escapedEn.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'gi');
      result = result.replace(regex,
        '<span class="term-hl">$&<span class="term-tooltip">' + escapedCn + '</span></span>');
    });
  }

  return result;
}

function renderParagraphs() {
  // CN column
  let cnHtml = '';
  if (cnParagraphs.length === 0) {
    cnHtml = '<div style="padding:40px;text-align:center;color:#aeaeb2;font-size:13px">暂无中文原文</div>';
  } else {
    cnParagraphs.forEach((p, i) => {
      cnHtml += '<div class="para-wrap" data-index="' + i + '">';
      cnHtml += '<span class="para-num">' + (i + 1) + '</span>';
      cnHtml += '<div class="para-cn">' + highlightTerms(p, 'cn') + '</div>';
      cnHtml += '</div>';
    });
  }
  cnContent.innerHTML = cnHtml;

  // EN column
  let enHtml = '';
  if (enParagraphs.length === 0) {
    enHtml = '<div style="padding:40px;text-align:center;color:#aeaeb2;font-size:13px">暂无英文翻译</div>';
  } else {
    enParagraphs.forEach((p, i) => {
      const isModified = modifiedParagraphs.hasOwnProperty(i);
      const displayText = modifiedParagraphs.hasOwnProperty(i) ? modifiedParagraphs[i] : p;
      enHtml += '<div class="para-wrap" data-index="' + i + '">';
      enHtml += '<span class="para-num">' + (i + 1) + '</span>';
      enHtml += '<div class="para-en' + (isModified ? ' modified' : '') + '" ';
      enHtml += 'contenteditable="true" data-index="' + i + '" ';
      enHtml += 'id="para-en-' + i + '">';
      enHtml += highlightTerms(displayText, 'en') + '</div>';
      enHtml += '</div>';
    });
  }
  enContent.innerHTML = enHtml;

  // Wire up contenteditable event listeners
  enContent.querySelectorAll('.para-en').forEach(el => {
    el.addEventListener('input', () => onParagraphEdit(el));
    el.addEventListener('focus', () => onParagraphFocus(el));
    el.addEventListener('keydown', (e) => handleKeydown(e, el));
  });

  // Scroll sync
  bindScrollSync();
}

function onParagraphEdit(el) {
  const idx = parseInt(el.dataset.index);
  // Get raw text (strip HTML from term highlights)
  const rawText = el.innerText || el.textContent || '';

  if (rawText !== enParagraphs[idx] && !modifiedParagraphs.hasOwnProperty(idx)) {
    modifiedParagraphs[idx] = rawText;
    el.classList.add('modified');
  } else if (modifiedParagraphs.hasOwnProperty(idx)) {
    if (rawText === enParagraphs[idx]) {
      delete modifiedParagraphs[idx];
      el.classList.remove('modified');
    } else {
      modifiedParagraphs[idx] = rawText;
    }
  }

  isDirty = true;
  btnSave.disabled = false;

  // Auto-save: trigger after 3 seconds of inactivity
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  setSaveStatus('saving');
  autoSaveTimer = setTimeout(() => {
    saveCurrentChapter();
  }, 3000);
}

function onParagraphFocus(el) {
  // Remove synced highlights
  enContent.querySelectorAll('.para-en.synced').forEach(e => e.classList.remove('synced'));
  cnContent.querySelectorAll('.para-cn.synced').forEach(e => e.classList.remove('synced'));

  const idx = parseInt(el.dataset.index);
  // Highlight corresponding paragraph in CN column
  const cnWraps = cnContent.querySelectorAll('.para-wrap');
  if (cnWraps[idx]) {
    cnWraps[idx].querySelector('.para-cn').classList.add('synced');
  }
  const enWraps = enContent.querySelectorAll('.para-wrap');
  if (enWraps[idx]) {
    enWraps[idx].querySelector('.para-en').classList.add('synced');
  }
}

function handleKeydown(e, el) {
  const idx = parseInt(el.dataset.index);

  // Tab: next paragraph
  if (e.key === 'Tab' && !e.shiftKey) {
    e.preventDefault();
    const next = enContent.querySelector('#para-en-' + (idx + 1));
    if (next) { next.focus(); }
  }

  // Shift+Tab: previous paragraph
  if (e.key === 'Tab' && e.shiftKey) {
    e.preventDefault();
    const prev = enContent.querySelector('#para-en-' + (idx - 1));
    if (prev) { prev.focus(); }
  }

  // Ctrl+S: save
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveCurrentChapter();
  }
}

// ═══════════════════════════════════════════════════════════════
// SCROLL SYNC
// ═══════════════════════════════════════════════════════════════

let scrollSyncing = false;

function bindScrollSync() {
  colCn.onscroll = () => {
    if (scrollSyncing) return;
    scrollSyncing = true;
    const ratio = colCn.scrollTop / (colCn.scrollHeight - colCn.clientHeight || 1);
    colEn.scrollTop = ratio * (colEn.scrollHeight - colEn.clientHeight);
    setTimeout(() => { scrollSyncing = false; }, 50);
  };

  colEn.onscroll = () => {
    if (scrollSyncing) return;
    scrollSyncing = true;
    const ratio = colEn.scrollTop / (colEn.scrollHeight - colEn.clientHeight || 1);
    colCn.scrollTop = ratio * (colCn.scrollHeight - colCn.clientHeight);
    setTimeout(() => { scrollSyncing = false; }, 50);
  };
}

// ═══════════════════════════════════════════════════════════════
// SAVE
// ═══════════════════════════════════════════════════════════════

async function saveCurrentChapter() {
  if (!isDirty) return;

  const paragraphs = Object.entries(modifiedParagraphs).map(([idx, text]) => ({
    index: parseInt(idx),
    text: text,
  }));

  if (paragraphs.length === 0) {
    isDirty = false;
    btnSave.disabled = true;
    setSaveStatus('saved');
    return;
  }

  setSaveStatus('saving');
  btnSave.disabled = true;

  try {
    const r = await fetch('/api/editor/' + jobId + '/chapters/' + currentChapter, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paragraphs: paragraphs }),
    });

    if (!r.ok) {
      const err = await r.text();
      showToast('保存失败: ' + err, true);
      setSaveStatus('idle');
      btnSave.disabled = false;
      return;
    }

    // Update local state: the edited paragraphs become the "canonical" EN text
    Object.keys(modifiedParagraphs).forEach(k => {
      enParagraphs[parseInt(k)] = modifiedParagraphs[k];
    });
    modifiedParagraphs = {};

    isDirty = false;
    setSaveStatus('saved');
    btnSave.disabled = true;
    editedSet.add(currentChapter);
    renderChapterButtons();
    loadStats();
  } catch (e) {
    showToast('保存失败: ' + e.message, true);
    setSaveStatus('idle');
    btnSave.disabled = false;
  }
}

btnSave.addEventListener('click', () => {
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  saveCurrentChapter();
});

// ═══════════════════════════════════════════════════════════════
// GLOBAL KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════════

document.addEventListener('keydown', (e) => {
  // Ctrl+S
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (autoSaveTimer) clearTimeout(autoSaveTimer);
    saveCurrentChapter();
  }
});

// ═══════════════════════════════════════════════════════════════
// BATCH REPLACE
// ═══════════════════════════════════════════════════════════════

batchOld.addEventListener('input', () => {
  btnBatchReplace.disabled = !batchOld.value.trim();
  batchResult.style.display = 'none';
});

batchNew.addEventListener('input', () => {
  batchResult.style.display = 'none';
});

btnBatchReplace.addEventListener('click', async () => {
  const termOld = batchOld.value.trim();
  const termNew = batchNew.value.trim();

  if (!termOld) return;

  btnBatchReplace.disabled = true;
  btnBatchReplace.textContent = '替换中...';
  batchResult.style.display = 'none';

  try {
    // Save current chapter first
    if (isDirty) await saveCurrentChapter();

    const r = await fetch('/api/editor/' + jobId + '/batch-replace', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ term_en_old: termOld, term_en_new: termNew }),
    });

    const d = await r.json();

    if (r.ok) {
      batchResult.textContent = '已替换 ' + d.replacements + ' 处';
      batchResult.className = 'batch-result';
      batchResult.style.display = 'block';
      showToast('已替换 ' + d.replacements + ' 处');

      // Reload current chapter to see replacements
      await loadChapter(currentChapter);
      loadStats();
    } else {
      batchResult.textContent = d.error || '替换失败';
      batchResult.className = 'batch-result error';
      batchResult.style.display = 'block';
      showToast(d.error || '替换失败', true);
    }
  } catch (e) {
    batchResult.textContent = '请求失败: ' + e.message;
    batchResult.className = 'batch-result error';
    batchResult.style.display = 'block';
    showToast('替换请求失败', true);
  }

  btnBatchReplace.disabled = false;
  btnBatchReplace.textContent = '替换术语';
});

// ═══════════════════════════════════════════════════════════════
// GLOSSARY PANEL
// ═══════════════════════════════════════════════════════════════

function renderGlossary() {
  const entries = Object.entries(glossary);
  if (entries.length === 0) {
    glossaryList.innerHTML = '<span style="color:#aeaeb2;font-size:11px">暂无术语</span>';
    return;
  }
  let h = '';
  entries.sort((a, b) => a[0].localeCompare(b[0])).slice(0, 50).forEach(([cn, en]) => {
    h += '<div class="glossary-item"><span class="glossary-cn">' + esc(cn) +
         '</span><span class="glossary-en">' + esc(en) + '</span></div>';
  });
  glossaryList.innerHTML = h;
}

// ═══════════════════════════════════════════════════════════════
// LAUNCH
// ═══════════════════════════════════════════════════════════════

init();
</script>
